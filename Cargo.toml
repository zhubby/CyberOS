[workspace]
members = ["apps/downloader", "apps/host-accessd", "apps/hostd", "apps/indexer", "apps/monitor", "apps/photostaff", "apps/termux", "apps/vod-player"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
async-trait = "0.1.89"
nix = { version = "0.30.1", features = ["fs", "process", "signal", "socket", "term", "user"] }
notify = "8.2.0"
quick-xml = "0.38.4"
base64 = "0.22.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "parsing"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = { version = "0.23.7", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat", "serde-json-impl"] }
uuid = { version = "1.18.1", features = ["v4"] }
unicode-normalization = "0.1.25"
zip = { version = "7.0.0", default-features = false, features = ["deflate"] }
sd-notify = "0.5.0"
futures-util = "0.3.31"
httpdate = "1.0.3"
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "ring", "rustls-platform-verifier", "smtp-transport", "tokio1-rustls"] }
rand = "0.9.2"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
tokio-util = "0.7.17"
url = "2.5.7"

[profile.release]
lto = "thin"
strip = true
