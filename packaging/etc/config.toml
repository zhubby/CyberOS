root_dir = "/zos"
environment = "production"

[api]
host = "127.0.0.1"
port = 3010
allowed_origins = []

[mcp]
enabled = true
pi_enabled = false
pi_token_file = "mcp/pi.token"
legacy_pi_tools_enabled = false
external_enabled = false
shell_enabled = false
allowed_hosts = ["localhost", "127.0.0.1", "[::1]"]
allowed_origins = ["localhost", "127.0.0.1", "[::1]"]
max_concurrent_per_client = 4

[worker]
poll_ms = 750
concurrency = 2

[monitoring]
enabled = true
fast_sample_interval_ms = 10000
standard_sample_interval_ms = 30000
temperature_sample_interval_ms = 300000
raw_retention_ms = 172800000
minute_retention_ms = 2592000000
hour_retention_ms = 31536000000
max_database_bytes = 536870912

[admin]
display_name = "ZOS Admin"
auth_mode = "local-only"

[model]
provider = "pi"
pi_command = "pi"
local_endpoint = ""

[docker]
enabled = false
socket_path = "/var/run/docker.sock"
compose_command = "docker"
operation_timeout_ms = 120000
console_shells = ["/bin/sh", "/bin/bash"]

[vm]
enabled = false
libvirt_uri = "qemu:///system"
storage_path = "/zos/vm"
network_name = "default"
iso_roots = ["/zos/iso"]
operation_timeout_ms = 120000
console_mode = "serial"

[hostd]
socket_path = "/run/zos/hostd.sock"

[shares]
enabled = false
account_username = "zos-share"

[terminal]
user = "zos"
termux_socket_path = "/run/zos/termux.sock"
session_idle_timeout_ms = 1800000
connect_timeout_ms = 10000
max_sessions = 32

[vod_player]
enabled = false
socket_path = "/run/zos/vod-player.sock"
state_path = "/zos/state/vod-player/session.json"
command_timeout_ms = 5000
startup_timeout_ms = 15000
checkpoint_interval_ms = 5000
retry_base_delay_ms = 2000
retry_max_delay_ms = 60000
video_output = "drm"
drm_connector = ""
audio_output = "alsa"
audio_device = ""
hwdec = "auto-safe"
user = "zos"

[[nas_roots]]
id = "primary"
name = "Primary NAS"
path = "/zos/data/primary"
mount_policy = "required"

[backup]
enabled = false
repository_path = "/zos/data/backup/restic"
password_file = "/zos/config/restic-password"
staging_path = "/zos/state/backup-staging"
require_mount = true
retry_count = 2
timeout_ms = 300000
keep_daily = 7
keep_weekly = 4

[health]
stale_index_warning_ms = 7200000
stale_index_critical_ms = 21600000
stalled_run_ms = 900000
consecutive_failure_threshold = 2
backup_stale_ms = 93600000
