name = "zos-appliance"
version = "1.5.6"
base_suite = "bookworm"
target_arch = "arm64"

[runtime]
node = ">=22"
database = "sqlite"
init = "systemd"
package = "zos.deb"

[services]
units = [
  "zos-api.service",
  "zos-monitor.service",
  "zos-alerter.service",
  "zos-termux.service",
  "zos-vod-player.service",
  "zos-tv-prepare.service",
  "zos-tv-weston.service",
  "zos-tv-chromium.service",
  "zos-tv-cec.service",
  "zos-tv.target",
  "zos-bluetoothd.service",
  "zos-hostd.service",
  "zos-host-accessd.service",
  "zos-worker@1.service",
  "zos-photostaff.service",
  "zos-downloader.service",
  "zos-indexer.service",
  "zos-maintenance.timer",
  "zos-backup-daily.timer",
  "zos-backup-weekly.timer",
  "zos-health.timer",
  "nginx.service",
  "docker.service",
  "libvirtd.service"
]

[packages]
base = [
  "systemd-sysv",
  "ca-certificates",
  "curl",
  "nodejs",
  "npm",
  "sqlite3",
  "bluez",
  "bluez-obexd",
  "bluez-alsa-utils",
  "libasound2-plugin-bluez",
  "dbus-user-session",
  "libheif-examples",
  "libimage-exiftool-perl",
  "libvips-tools",
  "ffmpeg",
  "libraw-bin",
  "tmux",
  "nginx",
  "restic",
  "git",
  "rsync",
  "docker.io",
  "docker-cli",
  "docker-compose",
  "libvirt-daemon-system",
  "libvirt-clients",
  "qemu-system-arm",
  "qemu-efi-aarch64",
  "qemu-utils",
  "virtinst",
  "ipxe-qemu"
]
ai = [
  "pi"
]
ocr_media_helpers = [
  "tesseract-ocr",
  "tesseract-ocr-chi-sim",
  "tesseract-ocr-eng",
  "poppler-utils",
  "imagemagick"
]
media_playback = [
  "mpv",
  "seatd",
  "chromium",
  "weston",
  "v4l-utils",
  "wtype",
  "fonts-noto-core",
  "fonts-noto-cjk",
  "fonts-noto-color-emoji"
]
nas_health = [
  "mdadm",
  "btrfs-progs",
  "smartmontools"
]
archive_helpers = [
  "gzip",
  "unzip",
  "libarchive-tools",
  "unrar-free"
]
sharing = [
  "samba",
  "apache2",
  "apache2-utils",
  "vsftpd",
  "libpam-pwdfile",
  "nfs-kernel-server",
  "minidlna"
]
