name: Deploy CM5

'on':
  workflow_run:
    workflows:
      - Package Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, for example v0.5.0
        required: true
        type: string
      verify_only:
        description: Verify the currently installed release without reinstalling it
        required: false
        default: false
        type: boolean
      allow_legacy_migration:
        description: Allow the one-time SigmaOS to ZOS production data migration
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: cm5-production
  cancel-in-progress: false

jobs:
  select-release:
    name: Select verified release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      deploy: ${{ steps.select.outputs.deploy }}
      tag: ${{ steps.select.outputs.tag }}
      version: ${{ steps.select.outputs.version }}
      commit_sha: ${{ steps.select.outputs.commit_sha }}
      asset: ${{ steps.select.outputs.asset }}
      sha256: ${{ steps.select.outputs.sha256 }}
    steps:
      - name: Select release manifest
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          work_dir="$RUNNER_TEMP/cm5-release"
          rm -rf "$work_dir"
          mkdir -p "$work_dir"

          write_skip() {
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            if [[ "$WORKFLOW_RUN_EVENT" != "push" || "$WORKFLOW_RUN_CONCLUSION" != "success" ||
                  "$WORKFLOW_RUN_HEAD_REPOSITORY" != "$REPOSITORY" ||
                  ! "$WORKFLOW_RUN_HEAD_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              write_skip
              exit 0
            fi

            if ! gh run download "$WORKFLOW_RUN_ID" \
              --repo "$REPOSITORY" \
              --name cm5-release-manifest \
              --dir "$work_dir" >"$work_dir/download.log" 2>&1; then
              # Branch pushes do not publish a release manifest and are expected
              # to produce a no-op deploy workflow run.
              write_skip
              exit 0
            fi
            expected_commit_sha="$WORKFLOW_RUN_HEAD_SHA"
            expected_tag="$WORKFLOW_RUN_HEAD_BRANCH"
          else
            dispatch_tag="$DISPATCH_TAG"
            if [[ ! "$dispatch_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "workflow_dispatch tag must be a stable vX.Y.Z tag" >&2
              exit 1
            fi
            gh release download "$dispatch_tag" \
              --repo "$REPOSITORY" \
              --pattern release-manifest.json \
              --dir "$work_dir"
            expected_commit_sha=""
            expected_tag="$dispatch_tag"
          fi

          manifest_path="$(find "$work_dir" -type f -name release-manifest.json -print -quit)"
          if [[ -z "$manifest_path" || ! -f "$manifest_path" ]]; then
            echo "Release manifest was not found" >&2
            exit 1
          fi

          if ! jq -e \
            --arg repository "$REPOSITORY" \
            --arg expected_commit_sha "$expected_commit_sha" \
            --arg expected_tag "$expected_tag" \
            'type == "object" and
             .repository == $repository and
             (.tag | type == "string" and test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) and
             (.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
             (.commitSha | type == "string" and test("^[0-9a-f]{40}$")) and
             (.architecture == "arm64") and
             (.asset | type == "string" and test("^zos_[0-9]+\\.[0-9]+\\.[0-9]+_arm64\\.deb$")) and
             (.sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
             (.tag == ("v" + .version)) and
             (.asset == ("zos_" + .version + "_arm64.deb")) and
             ($expected_commit_sha == "" or .commitSha == $expected_commit_sha) and
             .tag == $expected_tag' \
            "$manifest_path"; then
            echo "Release manifest validation failed" >&2
            exit 1
          fi

          mapfile -t manifest_values < <(jq -r '.tag, .version, .commitSha, .asset, .sha256' "$manifest_path")
          tag="${manifest_values[0]}"
          version="${manifest_values[1]}"
          commit_sha="${manifest_values[2]}"
          asset="${manifest_values[3]}"
          sha256="${manifest_values[4]}"

          release_dir="$work_dir/release"
          mkdir -p "$release_dir"
          gh release download "$tag" \
            --repo "$REPOSITORY" \
            --pattern "$asset" \
            --dir "$release_dir"
          package_path="$release_dir/$asset"
          [[ -f "$package_path" && ! -L "$package_path" ]] || {
            echo "Release asset $asset was not found" >&2
            exit 1
          }
          actual_sha256="$(sha256sum "$package_path" | awk '{print $1}')"
          [[ "$actual_sha256" == "$sha256" ]] || {
            echo "Release package checksum mismatch" >&2
            exit 1
          }
          [[ "$(dpkg-deb -f "$package_path" Version)" == "$version" ]] || {
            echo "Release package version mismatch" >&2
            exit 1
          }
          [[ "$(dpkg-deb -f "$package_path" Architecture)" == arm64 ]] || {
            echo "Release package architecture mismatch" >&2
            exit 1
          }

          printf 'deploy=true\n' >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\n' "$commit_sha" >> "$GITHUB_OUTPUT"
          printf 'asset=%s\n' "$asset" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy CM5
    needs: select-release
    if: needs.select-release.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.select-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.select-release.outputs.version }}
      RELEASE_COMMIT_SHA: ${{ needs.select-release.outputs.commit_sha }}
      RELEASE_ASSET: ${{ needs.select-release.outputs.asset }}
      RELEASE_SHA256: ${{ needs.select-release.outputs.sha256 }}
      CM5_HOST: ${{ vars.CM5_HOST }}
      CM5_DEPLOY_USER: ${{ vars.CM5_DEPLOY_USER }}
    steps:
      - name: Download and verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_dir="$RUNNER_TEMP/cm5-release"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ASSET" \
            --pattern release-manifest.json \
            --dir "$release_dir"

          package_path="$release_dir/$RELEASE_ASSET"
          manifest_path="$release_dir/release-manifest.json"
          [[ -f "$package_path" && -f "$manifest_path" ]]

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg version "$RELEASE_VERSION" \
            --arg commit_sha "$RELEASE_COMMIT_SHA" \
            --arg asset "$RELEASE_ASSET" \
            --arg sha256 "$RELEASE_SHA256" \
            '.repository == $repository and .tag == $tag and .version == $version and
             .commitSha == $commit_sha and .architecture == "arm64" and
             .asset == $asset and .sha256 == $sha256' "$manifest_path"

          actual_sha256="$(sha256sum "$package_path" | awk '{print $1}')"
          [[ "$actual_sha256" == "$RELEASE_SHA256" ]] || {
            echo "Release package checksum mismatch" >&2
            exit 1
          }

          package_version="$(dpkg-deb -f "$package_path" Version)"
          package_architecture="$(dpkg-deb -f "$package_path" Architecture)"
          [[ "$package_version" == "$RELEASE_VERSION" ]]
          [[ "$package_architecture" == arm64 ]]

      - name: Validate CM5 target
        run: |
          set -euo pipefail
          : "${CM5_HOST:?production variable CM5_HOST is required}"
          [[ "$CM5_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          CM5_DEPLOY_USER="${CM5_DEPLOY_USER:-sigmaos-deploy}"
          [[ "$CM5_DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$CM5_DEPLOY_USER" != root ]]

      - name: Verify GitHub OIDC identity
        env:
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC request URL is unavailable}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC request token is unavailable}"
          : "${GITHUB_REPOSITORY:?GitHub repository is unavailable}"
          : "${GITHUB_REPOSITORY_ID:?GitHub repository ID is unavailable}"
          : "${GITHUB_REPOSITORY_OWNER:?GitHub repository owner is unavailable}"
          : "${GITHUB_REPOSITORY_OWNER_ID:?GitHub repository owner ID is unavailable}"
          : "${TS_AUDIENCE:?production secret TS_AUDIENCE is required}"
          : "${TS_OAUTH_CLIENT_ID:?production secret TS_OAUTH_CLIENT_ID is required}"

          repository_name="${GITHUB_REPOSITORY#*/}"
          [[ "$GITHUB_REPOSITORY" == "$GITHUB_REPOSITORY_OWNER/$repository_name" ]]
          [[ "$repository_name" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$GITHUB_REPOSITORY_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_REPOSITORY_OWNER_ID" =~ ^[0-9]+$ ]]
          expected_subject="repo:${GITHUB_REPOSITORY_OWNER}@${GITHUB_REPOSITORY_OWNER_ID}/${repository_name}@${GITHUB_REPOSITORY_ID}:environment:production"
          expected_audience="api.tailscale.com/$TS_OAUTH_CLIENT_ID"
          [[ "$TS_AUDIENCE" == "$expected_audience" ]] || {
            echo "TS_AUDIENCE does not match the configured Tailscale client ID" >&2
            exit 1
          }

          token_response="$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$TS_AUDIENCE")"
          oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' <<<"$token_response")"

          EXPECTED_SUBJECT="$expected_subject" OIDC_TOKEN="$oidc_token" node <<'NODE'
          const token = process.env.OIDC_TOKEN;
          const expectedAudience = process.env.TS_AUDIENCE;
          const expectedSubject = process.env.EXPECTED_SUBJECT;
          const segments = token?.split(".") ?? [];
          if (segments.length !== 3) {
            throw new Error("GitHub returned an invalid OIDC token");
          }

          const claims = JSON.parse(Buffer.from(segments[1], "base64url").toString("utf8"));
          console.log(JSON.stringify({
            issuer: claims.iss,
            subject: claims.sub,
            audience: claims.aud,
            repository: claims.repository,
            environment: claims.environment,
            workflowRef: claims.workflow_ref
          }));

          if (claims.iss !== "https://token.actions.githubusercontent.com") {
            throw new Error(`unexpected GitHub OIDC issuer: ${claims.iss}`);
          }
          if (claims.sub !== expectedSubject) {
            throw new Error(`unexpected GitHub OIDC subject: ${claims.sub}`);
          }
          if (claims.aud !== expectedAudience) {
            throw new Error("GitHub OIDC audience does not match TS_AUDIENCE");
          }
          NODE

      - name: Connect to Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-actions
          ping: ${{ vars.CM5_HOST }}

      - name: Capture CM5 upgrade baseline
        run: |
          set -euo pipefail

          CM5_DEPLOY_USER="${CM5_DEPLOY_USER:-sigmaos-deploy}"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=accept-new
          )
          mapfile -t baseline < <(
            ssh "${ssh_options[@]}" "$CM5_DEPLOY_USER@$CM5_HOST" sh -s <<'REMOTE'
          set -eu
          [ -x /usr/local/bin/node ]
          runtime_node_version="$(/usr/local/bin/node --version)"
          case "$runtime_node_version" in
            v22.*) ;;
            *) printf 'CM5 runtime requires Node.js 22; found %s\n' "$runtime_node_version" >&2; exit 1 ;;
          esac
          if [ "$(dpkg-query -W -f='${Status}' zos 2>/dev/null || true)" = "install ok installed" ] && \
              [ -x /usr/local/sbin/zos-deploy ]; then
            layout=zos
            package_name=zos
            config_sha256="$(sudo -n /usr/local/sbin/zos-deploy --config-sha256)"
            migration_payload="$(sudo -n /usr/local/sbin/zos-deploy --migration-status)"
            migration_metadata="$(node - "$migration_payload" "$config_sha256" <<'NODE'
          const [serializedPayload, currentConfigSha256] = process.argv.slice(2);
          const payload = JSON.parse(serializedPayload);
          if (!["none", "pending", "committed", "rolled_back"].includes(payload.status)) {
            throw new Error(`unsupported migration state: ${serializedPayload}`);
          }
          const sourceConfigSha256 = payload.status === "none"
            ? currentConfigSha256
            : payload.sourceConfigSha256;
          if (!/^[0-9a-f]{64}$/u.test(sourceConfigSha256 ?? "")) {
            throw new Error(`invalid migration source config checksum: ${serializedPayload}`);
          }
          process.stdout.write(`${payload.status}:${sourceConfigSha256}`);
          NODE
            )"
            migration_status="${migration_metadata%%:*}"
            migration_source_config_sha256="${migration_metadata#*:}"
            if [ -d /zos/deploy/incoming ] && [ -w /zos/deploy/incoming ]; then
              staging_channel=zos
            else
              staging_channel=legacy
              [ -x /usr/local/sbin/sigmaos-deploy ] || {
                echo "ZOS staging recovery requires the legacy deployment helper" >&2
                exit 1
              }
              [ -d /var/lib/sigmaos-deploy/incoming ] && [ -w /var/lib/sigmaos-deploy/incoming ] || {
                echo "ZOS staging recovery requires the writable legacy staging directory" >&2
                exit 1
              }
              [ "$(systemctl is-enabled sigmaos-hostd.service 2>/dev/null || true)" = masked ] || {
                echo "ZOS staging recovery requires legacy services to remain masked" >&2
                exit 1
              }
            fi
          elif [ -f /etc/sigmaos/config.toml ] && [ -r /etc/sigmaos/config.toml ] && \
              [ "$(dpkg-query -W -f='${Status}' sigmaos 2>/dev/null || true)" = "install ok installed" ]; then
            layout=sigmaos
            package_name=sigmaos
            config_sha256="$(sha256sum /etc/sigmaos/config.toml | awk '{print $1}')"
            migration_status=none
            migration_source_config_sha256="$config_sha256"
            staging_channel=legacy
          else
            printf 'CM5 has neither a valid ZOS nor a migratable SigmaOS installation\n' >&2
            exit 1
          fi
          package_version="$(dpkg-query -W -f='${Version}' "$package_name")"
          package_status="$(dpkg-query -W -f='${Status}' "$package_name")"
          printf '%s\n%s\n%s\n%s\n%s\n%s\n%s\n%s\n' \
            "$layout" "$config_sha256" "$package_version" "$package_status" \
            "$runtime_node_version" "$migration_status" "$staging_channel" \
            "$migration_source_config_sha256"
          REMOTE
          )
          [[ "${baseline[0]:-}" == zos || "${baseline[0]:-}" == sigmaos ]]
          [[ "${baseline[1]:-}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${baseline[5]:-}" == none || "${baseline[5]:-}" == pending || \
             "${baseline[5]:-}" == committed || "${baseline[5]:-}" == rolled_back ]]
          [[ "${baseline[6]:-}" == zos || "${baseline[6]:-}" == legacy ]]
          [[ "${baseline[7]:-}" =~ ^[0-9a-f]{64}$ ]]
          if [[ "${baseline[0]}" == sigmaos || "${baseline[5]}" == pending || \
                "${baseline[5]}" == rolled_back || "${baseline[6]}" == legacy ]] && \
              [[ "${{ github.event_name }}" != workflow_dispatch ]]; then
            echo "Legacy migration recovery requires an explicit workflow_dispatch with allow_legacy_migration=true" >&2
            exit 1
          fi
          if [[ "${baseline[0]}" == sigmaos || "${baseline[5]}" == pending || \
                "${baseline[5]}" == rolled_back || "${baseline[6]}" == legacy ]] && \
              [[ "${{ inputs.allow_legacy_migration }}" != true ]]; then
            echo "Legacy migration recovery was not explicitly authorized" >&2
            exit 1
          fi
          printf '%s\n' "${baseline[0]}" > "$RUNNER_TEMP/cm5-layout"
          printf '%s\n' "${baseline[1]}" > "$RUNNER_TEMP/cm5-config.sha256"
          printf '%s\n' "${baseline[5]}" > "$RUNNER_TEMP/cm5-migration-status"
          printf '%s\n' "${baseline[6]}" > "$RUNNER_TEMP/cm5-staging-channel"
          printf '%s\n' "${baseline[7]}" > "$RUNNER_TEMP/cm5-migration-source-config.sha256"
          printf 'CM5 upgrade baseline: layout=%s version=%s status=%s node=%s migration=%s staging=%s\n' \
            "${baseline[0]}" "${baseline[2]:-unknown}" "${baseline[3]:-unknown}" \
            "${baseline[4]:-unknown}" "${baseline[5]}" "${baseline[6]}"

      - name: Stage and deploy release on CM5
        if: inputs.verify_only != true
        timeout-minutes: 75
        run: |
          set -euo pipefail

          : "${CM5_HOST:?production variable CM5_HOST is required}"
          CM5_DEPLOY_USER="${CM5_DEPLOY_USER:-sigmaos-deploy}"
          [[ "$CM5_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ "$CM5_DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$CM5_DEPLOY_USER" != root ]]

          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=accept-new
          )
          release_dir="$RUNNER_TEMP/cm5-release"
          layout="$(<"$RUNNER_TEMP/cm5-layout")"
          migration_status="$(<"$RUNNER_TEMP/cm5-migration-status")"
          migration_source_config_sha256="$(<"$RUNNER_TEMP/cm5-migration-source-config.sha256")"
          staging_channel="$(<"$RUNNER_TEMP/cm5-staging-channel")"

          stage_release() {
            local incoming_dir=$1
            local manifest_path=$2
            local upload_name=$3
            local local_parts_dir="$release_dir/parts-$upload_name"
            local remote_parts_dir="$incoming_dir/package.deb.$RELEASE_SHA256.parts"
            local partial_package="$incoming_dir/package.deb.$RELEASE_SHA256.download"

            scp "${ssh_options[@]}" "$manifest_path" \
              "$CM5_DEPLOY_USER@$CM5_HOST:$incoming_dir/release-manifest.json"
            rm -rf "$local_parts_dir"
            mkdir -p "$local_parts_dir"
            split -b 4m -d -a 4 "$release_dir/$RELEASE_ASSET" "$local_parts_dir/part-"
            mapfile -t part_paths < <(find "$local_parts_dir" -type f -name 'part-*' -print | sort)
            ((${#part_paths[@]} > 0))

            ssh "${ssh_options[@]}" "$CM5_DEPLOY_USER@$CM5_HOST" sh -s -- \
              "$remote_parts_dir" "${part_paths[@]##*/}" <<'REMOTE'
          set -eu
          remote_parts_dir=$1
          shift
          if [ -L "$remote_parts_dir" ] || { [ -e "$remote_parts_dir" ] && [ ! -d "$remote_parts_dir" ]; }; then
            echo "Release parts path is not a directory" >&2
            exit 1
          fi
          umask 077
          mkdir -p "$remote_parts_dir"
          for part_name do
            case "$part_name" in
              part-[0-9][0-9][0-9][0-9]) ;;
              *) echo "Invalid release part name" >&2; exit 1 ;;
            esac
            part_path="$remote_parts_dir/$part_name"
            if [ -L "$part_path" ] || { [ -e "$part_path" ] && [ ! -f "$part_path" ]; }; then
              echo "Release part is not a regular file" >&2
              exit 1
            fi
            if [ ! -e "$part_path" ]; then
              : > "$part_path"
            fi
          done
          REMOTE

            upload_part() {
              local part_path=$1
              local part_name=${part_path##*/}
              local expected_size
              local expected_sha256
              local remote_state
              expected_size="$(stat --format=%s "$part_path")"
              expected_sha256="$(sha256sum "$part_path" | awk '{print $1}')"
              for attempt in 1 2 3; do
                remote_state="$(
                  ssh "${ssh_options[@]}" "$CM5_DEPLOY_USER@$CM5_HOST" sh -s -- \
                    "$remote_parts_dir/$part_name" "$expected_size" "$expected_sha256" <<'REMOTE'
          set -eu
          remote_part_path=$1
          expected_size=$2
          expected_sha256=$3
          if [ -L "$remote_part_path" ] || [ ! -f "$remote_part_path" ]; then
            echo "Release part is missing or not a regular file" >&2
            exit 1
          fi
          actual_size="$(stat --format=%s "$remote_part_path")"
          if [ "$actual_size" -eq "$expected_size" ]; then
            actual_sha256="$(sha256sum "$remote_part_path" | awk '{print $1}')"
            if [ "$actual_sha256" = "$expected_sha256" ]; then
              printf '%s\n' complete
              exit 0
            fi
            : > "$remote_part_path"
          elif [ "$actual_size" -gt "$expected_size" ]; then
            : > "$remote_part_path"
          fi
          printf '%s\n' upload
          REMOTE
                )"
                if [ "$remote_state" = complete ]; then
                  return 0
                fi
                [ "$remote_state" = upload ]
                if timeout --signal=TERM --kill-after=30s 900 \
                    sftp -B 131072 -R 16 -b - "${ssh_options[@]}" \
                    "$CM5_DEPLOY_USER@$CM5_HOST" <<SFTP
          reput "$part_path" "$remote_parts_dir/$part_name"
          SFTP
                then
                  return 0
                fi
                printf 'SFTP upload of %s attempt %s failed; preserving part for resume\n' "$part_name" "$attempt" >&2
              done
              return 1
            }

            part_index=0
            while ((part_index < ${#part_paths[@]})); do
              part_pids=()
              batch_end=$((part_index + 4))
              while ((part_index < batch_end && part_index < ${#part_paths[@]})); do
                upload_part "${part_paths[part_index]}" &
                part_pids+=("$!")
                part_index=$((part_index + 1))
              done
              batch_failed=0
              for part_pid in "${part_pids[@]}"; do
                if ! wait "$part_pid"; then
                  batch_failed=1
                fi
              done
              ((batch_failed == 0))
            done

            ssh "${ssh_options[@]}" "$CM5_DEPLOY_USER@$CM5_HOST" sh -s -- \
              "$remote_parts_dir" "$partial_package" "$RELEASE_SHA256" \
              "${#part_paths[@]}" "$incoming_dir" <<'REMOTE'
          set -eu
          remote_parts_dir=$1
          partial_package=$2
          expected_sha256=$3
          part_count=$4
          incoming_dir=$5
          if [ -L "$partial_package" ] || { [ -e "$partial_package" ] && [ ! -f "$partial_package" ]; }; then
            echo "Partial release package is not a regular file" >&2
            exit 1
          fi
          assembled_package="$partial_package.assemble.$$"
          rm -f "$assembled_package"
          part_index=0
          while [ "$part_index" -lt "$part_count" ]; do
            part_name=$(printf 'part-%04d' "$part_index")
            part_path="$remote_parts_dir/$part_name"
            if [ -L "$part_path" ] || [ ! -f "$part_path" ]; then
              echo "Release part is missing or not a regular file" >&2
              rm -f "$assembled_package"
              exit 1
            fi
            cat "$part_path" >> "$assembled_package"
            part_index=$((part_index + 1))
          done
          actual_sha256="$(sha256sum "$assembled_package" | awk '{print $1}')"
          [ "$actual_sha256" = "$expected_sha256" ] || {
            echo "Assembled release package checksum mismatch" >&2
            rm -f "$assembled_package"
            exit 1
          }
          mv -f "$assembled_package" "$partial_package"
          rm -rf "$remote_parts_dir"
          actual_sha256="$(sha256sum "$partial_package" | awk '{print $1}')"
          [ "$actual_sha256" = "$expected_sha256" ] || {
            echo "Assembled release package checksum mismatch after move" >&2
            rm -f "$partial_package"
            exit 1
          }
          mv -f "$partial_package" "$incoming_dir/package.deb"
          REMOTE
          }

          if [[ "$staging_channel" == legacy ]]; then
            legacy_manifest="$release_dir/legacy-release-manifest.json"
            jq --arg repository "zhubby/SigmaOS" \
              --arg asset "sigmaos_${RELEASE_VERSION}_arm64.deb" \
              '.repository = $repository | .asset = $asset' \
              "$release_dir/release-manifest.json" > "$legacy_manifest"
            stage_release /var/lib/sigmaos-deploy/incoming "$legacy_manifest" legacy

            legacy_status=0
            ssh "${ssh_options[@]}" "$CM5_DEPLOY_USER@$CM5_HOST" \
              "printf 'N\\n' | sudo -n /usr/local/sbin/sigmaos-deploy" || legacy_status=$?
            if ((legacy_status == 0)); then
              echo "Legacy helper unexpectedly reported completed ZOS activation" >&2
              exit 1
            fi

            expected_config_sha256="$(<"$RUNNER_TEMP/cm5-config.sha256")"
            ssh "${ssh_options[@]}" "$CM5_DEPLOY_USER@$CM5_HOST" sh -s -- \
              "$RELEASE_VERSION" "$expected_config_sha256" "$layout" "$migration_status" \
              "$migration_source_config_sha256" <<'REMOTE'
          set -eu
          expected_version=$1
          expected_config_sha256=$2
          previous_layout=$3
          expected_migration_status=$4
          expected_migration_source_config_sha256=$5
          if [ "$previous_layout" = sigmaos ]; then
            expected_migration_status=pending
          fi
          [ "$(dpkg-query -W -f='${Status}' zos)" = "install ok installed" ]
          [ "$(dpkg-query -W -f='${Version}' zos)" = "$expected_version" ]
          [ -x /usr/local/sbin/zos-deploy ]
          if [ "$previous_layout" = zos ]; then
            actual_config_sha256="$(sudo -n /usr/local/sbin/zos-deploy --config-sha256)"
            [ "$actual_config_sha256" = "$expected_config_sha256" ]
          fi
          migration_status="$(sudo -n /usr/local/sbin/zos-deploy --migration-status)"
          node - "$migration_status" "$expected_migration_status" \
            "$expected_migration_source_config_sha256" <<'NODE'
          const [payload, expectedStatus, expectedMigrationSourceConfigSha256] = process.argv.slice(2);
          const status = JSON.parse(payload);
          if (status.status !== expectedStatus ||
              (expectedStatus === "pending" &&
               status.sourceConfigSha256 !== expectedMigrationSourceConfigSha256)) {
            throw new Error(`unexpected migration state: ${payload}`);
          }
          NODE
          if findmnt --fstab -rn -o TARGET | grep -Eq '^/srv/(nas|backup|apps|iso)(/|$)'; then
            echo "Legacy mount targets remain in /etc/fstab" >&2
            exit 1
          fi
          for unit in sigmaos-api.service sigmaos-worker@1.service sigmaos-indexer.service sigmaos-hostd.service sigmaos-termux.service; do
            ! systemctl is-active --quiet "$unit"
          done
          REMOTE
          fi

          stage_release /zos/deploy/incoming "$release_dir/release-manifest.json" zos
          ssh "${ssh_options[@]}" "$CM5_DEPLOY_USER@$CM5_HOST" \
            "printf 'N\\n' | sudo -n /usr/local/sbin/zos-deploy --no-upgrade-backup"

      - name: Verify CM5 services and build metadata
        timeout-minutes: 20
        run: |
          set -euo pipefail

          CM5_DEPLOY_USER="${CM5_DEPLOY_USER:-sigmaos-deploy}"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=accept-new
          )
          layout="$(<"$RUNNER_TEMP/cm5-layout")"
          previous_migration_status="$(<"$RUNNER_TEMP/cm5-migration-status")"
          expected_migration_source_config_sha256="$(<"$RUNNER_TEMP/cm5-migration-source-config.sha256")"
          expected_config_sha256="$(<"$RUNNER_TEMP/cm5-config.sha256")"
          ssh "${ssh_options[@]}" "$CM5_DEPLOY_USER@$CM5_HOST" sh -s -- \
            "$RELEASE_VERSION" "$RELEASE_COMMIT_SHA" "$expected_config_sha256" \
            "$layout" "$previous_migration_status" "$expected_migration_source_config_sha256" <<'REMOTE'
          set -eu
          expected_version=$1
          expected_commit_sha=$2
          expected_config_sha256=$3
          previous_layout=$4
          previous_migration_status=$5
          expected_migration_source_config_sha256=$6
          check_dir="$(mktemp -d /tmp/zos-deploy-check.XXXXXX)"
          trap 'rm -rf "$check_dir"' EXIT HUP INT TERM

          installed_status="$(dpkg-query -W -f='${Status}' zos)"
          installed_version="$(dpkg-query -W -f='${Version}' zos)"
          [ "$installed_status" = "install ok installed" ]
          [ "$installed_version" = "$expected_version" ]
          actual_config_sha256="$(sudo -n /usr/local/sbin/zos-deploy --config-sha256)"
          if [ "$previous_layout" = zos ]; then
            [ "$actual_config_sha256" = "$expected_config_sha256" ]
          fi
          if [ "$previous_layout" = sigmaos ] || [ "$previous_migration_status" = pending ] || \
              [ "$previous_migration_status" = rolled_back ]; then
            migration_status="$(sudo -n /usr/local/sbin/zos-deploy --migration-status)"
            node - "$migration_status" "$expected_migration_source_config_sha256" <<'NODE'
          const [payload, expectedMigrationSourceConfigSha256] = process.argv.slice(2);
          const status = JSON.parse(payload);
          if (status.status !== "committed" ||
              status.sourceConfigSha256 !== expectedMigrationSourceConfigSha256 ||
              typeof status.backupPath !== "string" ||
              !status.backupPath.startsWith("/zos/system-backups/legacy-sigmaos-")) {
            throw new Error(`unexpected committed migration state: ${payload}`);
          }
          NODE
            [ "$(sudo -n /usr/local/sbin/zos-deploy --migration-backup-check)" = ok ]
            if findmnt --fstab -rn -o TARGET | grep -Eq '^/srv/(nas|backup|apps|iso)(/|$)'; then
              echo "Legacy mount targets remain in /etc/fstab" >&2
              exit 1
            fi
            findmnt -rn --mountpoint /zos/data/primary/pool1 >/dev/null
            for unit in sigmaos-api.service sigmaos-worker@1.service sigmaos-indexer.service sigmaos-hostd.service sigmaos-termux.service; do
              ! systemctl is-active --quiet "$unit"
            done
          fi

          check_active_unit() {
            unit=$1
            attempt=1
            while [ "$attempt" -le 12 ]; do
              if systemctl is-active --quiet "$unit"; then
                return 0
              fi
              printf 'waiting for %s (attempt %s/12)\n' "$unit" "$attempt" >&2
              systemctl show --property=ActiveState,SubState,ExecMainStatus --value "$unit" >&2 || true
              attempt=$((attempt + 1))
              sleep 5
            done
            printf 'required service is not active: %s\n' "$unit" >&2
            systemctl status --no-pager --full "$unit" >&2 || true
            journalctl -u "$unit" -n 100 --no-pager >&2 || true
            return 3
          }

          runtime_fingerprint() {
            for unit in \
              zos-api.service \
              zos-monitor.service \
              zos-worker@1.service \
              zos-photostaff.service \
              zos-downloader.service \
              zos-indexer.service \
              zos-hostd.service \
              zos-termux.service; do
              main_pid="$(systemctl show --property=MainPID --value "$unit")"
              restart_count="$(systemctl show --property=NRestarts --value "$unit")"
              printf '%s:%s:%s\n' "$unit" "$main_pid" "$restart_count"
            done
          }

          wait_for_indexer_ready() {
            status_path="$check_dir/indexer-status.json"
            attempt=1
            while [ "$attempt" -le 120 ]; do
              if curl --fail --silent --show-error --max-time 15 \
                http://127.0.0.1:3010/api/indexer/status > "$status_path" && \
                node - "$status_path" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const ready = payload?.service?.status === "ready" && payload.service.freshWorkers > 0 &&
            payload?.watcher?.status === "ready" && payload?.queue?.stalled === false;
          process.exit(ready ? 0 : 1);
          NODE
              then
                return 0
              fi
              sleep 2
              attempt=$((attempt + 1))
            done
            printf 'indexer did not become ready after 120 attempts\n' >&2
            [ ! -s "$status_path" ] || cat "$status_path" >&2
            return 1
          }

          for unit in \
            zos-api.service \
            zos-monitor.service \
            zos-worker@1.service \
            zos-photostaff.service \
            zos-downloader.service \
            zos-indexer.service \
            zos-hostd.service \
            zos-termux.service; do
            systemctl is-enabled --quiet "$unit"
            check_active_unit "$unit"
          done
          for unit in \
            zos-maintenance.timer \
            zos-health.timer \
            zos-backup-daily.timer \
            zos-backup-weekly.timer; do
            systemctl is-enabled --quiet "$unit"
            check_active_unit "$unit"
            timer_schedule="$(systemctl show \
              --property=NextElapseUSecRealtime \
              --property=NextElapseUSecMonotonic \
              "$unit")"
            printf '%s\n' "$timer_schedule" | \
              grep -Eq '^NextElapseUSec(Realtime|Monotonic)=.+$'
          done
          wait_for_indexer_ready
          runtime_before="$(runtime_fingerprint)"
          sleep 30
          for unit in \
            zos-api.service \
            zos-monitor.service \
            zos-worker@1.service \
            zos-photostaff.service \
            zos-downloader.service \
            zos-indexer.service \
            zos-hostd.service \
            zos-termux.service; do
            check_active_unit "$unit"
          done
          runtime_after="$(runtime_fingerprint)"
          if [ "$runtime_before" != "$runtime_after" ]; then
            printf 'runtime before stabilization:\n%s\nruntime after stabilization:\n%s\n' \
              "$runtime_before" "$runtime_after" >&2
            exit 1
          fi
          systemctl show --property ExecStart --value zos-termux.service | \
            grep -Fq /usr/lib/zos/bin/zos-termux
          failed_units="$(systemctl --failed --no-legend --plain | awk '$1 ~ /^zos-/ { print }' || true)"
          if [ -n "$failed_units" ]; then
            printf '%s\n' "$failed_units" >&2
            exit 1
          fi

          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3010/health > "$check_dir/health.json"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3010/api/roots/readiness > "$check_dir/readiness.json"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3010/api/system/health > "$check_dir/system-health.json"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3010/api/system/build-info > "$check_dir/build-info.json"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3010/api/monitoring/overview > "$check_dir/monitoring-overview.json"
          wait_for_indexer_ready

          database_check="$(sudo -n /usr/local/sbin/zos-deploy --database-check)"
          [ "$database_check" = ok ]

          node - "$check_dir/build-info.json" "$expected_version" "$expected_commit_sha" <<'NODE'
          const fs = require("node:fs");
          const [file, expectedVersion, expectedCommitSha] = process.argv.slice(2);
          const payload = JSON.parse(fs.readFileSync(file, "utf8"));
          const build = payload?.build;
          if (build?.version !== expectedVersion || build?.commitSha?.toLowerCase() !== expectedCommitSha.toLowerCase()) {
            throw new Error(`build metadata mismatch: ${JSON.stringify(build)}`);
          }
          NODE
          node - "$check_dir/readiness.json" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(payload?.roots) || payload.roots.length === 0 ||
              payload.roots.some((root) => root.status !== "ready")) {
            throw new Error(`one or more NAS roots are not ready: ${JSON.stringify(payload?.roots)}`);
          }
          NODE
          node - "$check_dir/system-health.json" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (payload?.operations?.health?.status !== "ready") {
            throw new Error(`health operation is not ready: ${JSON.stringify(payload?.operations?.health)}`);
          }
          NODE
          node - "$check_dir/monitoring-overview.json" <<'NODE'
          const fs = require("node:fs");
          const payload = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!["ready", "degraded"].includes(payload?.status) || payload.enabled !== true ||
              !Array.isArray(payload.latest) || payload.latest.length === 0 ||
              !Number.isFinite(payload?.retention?.databaseBytes) || payload.retention.databaseBytes <= 0) {
            throw new Error(`monitoring did not produce a usable sample: ${JSON.stringify(payload)}`);
          }
          NODE
          REMOTE

      - name: Capture CM5 failure diagnostics
        if: failure()
        run: |
          set -euo pipefail

          CM5_DEPLOY_USER="${CM5_DEPLOY_USER:-sigmaos-deploy}"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
            -o StrictHostKeyChecking=accept-new
          )
          ssh "${ssh_options[@]}" "$CM5_DEPLOY_USER@$CM5_HOST" sh -s <<'REMOTE'
          set -u
          for endpoint in \
            /api/settings/shares \
            /api/roots \
            /api/shares/summary; do
            printf '\n===== GET %s =====\n' "$endpoint"
            curl --fail --silent --show-error --max-time 15 \
              "http://127.0.0.1:3010$endpoint" || true
            printf '\n'
          done
          printf '\n===== share service status =====\n'
          systemctl status \
            smbd.service \
            nmbd.service \
            zos-webdav.service \
            vsftpd.service \
            nfs-server.service \
            minidlna.service \
            --no-pager --full || true
          printf '\n===== share service journal =====\n'
          journalctl \
            -u smbd.service \
            -u nmbd.service \
            -u zos-webdav.service \
            -u vsftpd.service \
            -u nfs-server.service \
            -u minidlna.service \
            -n 300 --no-pager || true
          REMOTE
