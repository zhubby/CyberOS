name: Package Release

'on':
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y acl
          npm ci --registry=https://registry.npmjs.org

      - name: Install documentation dependencies
        run: npm --prefix docs ci --registry=https://registry.npmjs.org

      - name: Verify version policy
        env:
          CYBEROS_VERSION_BASE: ${{ github.event.pull_request.base.sha || (github.ref_type == 'branch' && github.event.before) || '' }}
          CYBEROS_RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run version:check

      - name: Verify protocol bindings
        run: npm run protocol:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Package (amd64)
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0

      - name: Install Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            acl \
            build-essential \
            cargo \
            debhelper \
            dpkg-dev \
            fakeroot \
            nodejs \
            npm \
            rsync \
            rustc \
            unzip \
            zip

      - name: Build Debian package
        run: CYBEROS_NPM_REGISTRY=https://registry.npmjs.org packaging/scripts/build-deb.sh

      - name: Collect package artifacts
        run: |
          artifact_dir="artifacts/amd64"
          mkdir -p "$artifact_dir"

          shopt -s nullglob
          files=(.cyberos/*.deb .cyberos/*.changes .cyberos/*.buildinfo)
          if (( ${#files[@]} == 0 )); then
            echo "No Debian package artifacts were produced under .cyberos" >&2
            exit 1
          fi

          cp "${files[@]}" "$artifact_dir/"

          for extension in deb changes buildinfo; do
            matches=("$artifact_dir"/cyberos_*_amd64."$extension")
            if (( ${#matches[@]} != 1 )); then
              echo "Expected exactly one amd64 .$extension artifact, found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
          done

          ls -lh "$artifact_dir"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyberos-deb-amd64
          path: artifacts/amd64/*
          if-no-files-found: error
          retention-days: 30

  package-arm64:
    name: Package (arm64)
    needs: quality
    runs-on: ubuntu-24.04-arm
    container: node:22-bookworm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Debian packaging dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            acl \
            build-essential \
            ca-certificates \
            cargo \
            debhelper \
            dpkg-dev \
            fakeroot \
            git \
            nodejs \
            npm \
            rsync \
            rustc \
            unzip \
            zip

      - name: Set up Rust 1.95.0
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.95.0

      - name: Verify Node.js runtime
        run: |
          [[ "$(command -v node)" == /usr/local/bin/node ]]
          [[ "$(command -v npm)" == /usr/local/bin/npm ]]
          node --version | grep -Eq '^v22\.'

      - name: Build Debian package
        run: CYBEROS_NPM_REGISTRY=https://registry.npmjs.org packaging/scripts/build-deb.sh

      - name: Collect package artifacts
        run: |
          artifact_dir="artifacts/arm64"
          mkdir -p "$artifact_dir"

          shopt -s nullglob
          files=(.cyberos/*.deb .cyberos/*.changes .cyberos/*.buildinfo)
          if (( ${#files[@]} == 0 )); then
            echo "No Debian package artifacts were produced under .cyberos" >&2
            exit 1
          fi

          cp "${files[@]}" "$artifact_dir/"

          for extension in deb changes buildinfo; do
            matches=("$artifact_dir"/cyberos_*_arm64."$extension")
            if (( ${#matches[@]} != 1 )); then
              echo "Expected exactly one arm64 .$extension artifact, found ${#matches[@]}" >&2
              printf '%s\n' "${matches[@]}" >&2
              exit 1
            fi
          done

          ls -lh "$artifact_dir"

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cyberos-deb-arm64
          path: artifacts/arm64/*
          if-no-files-found: error
          retention-days: 30

  docs-browser:
    name: Documentation browser smoke
    needs: quality
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --registry=https://registry.npmjs.org
          npm --prefix docs ci --registry=https://registry.npmjs.org

      - name: Install Chromium
        run: npm --prefix docs exec -- playwright install --with-deps chromium

      - name: Build documentation
        run: npm run docs:build

      - name: Run browser smoke tests
        run: npm run docs:browser

  nix:
    name: Nix (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-linux
            runner: ubuntu-24.04
          - arch: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@c5a866b6ab867e88becbed4467b93592bce69f8a # v21

      - name: Check flake and build packages
        run: nix flake check --print-build-logs

  release:
    name: GitHub Release
    needs: [package, package-arm64, docs-browser, nix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag $GITHUB_REF_NAME must point to a commit reachable from origin/main" >&2
            exit 1
          fi

      - name: Verify tag matches Debian changelog
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          changelog_version="$(sed -n '1s/^cyberos (\([^)]*\)).*/\1/p' packaging/debian/changelog)"

          if [[ -z "$changelog_version" ]]; then
            echo "Could not read CyberOS version from packaging/debian/changelog" >&2
            exit 1
          fi

          if [[ "$tag_version" != "$changelog_version" ]]; then
            echo "Tag version v$tag_version does not match Debian changelog version $changelog_version" >&2
            exit 1
          fi

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: cyberos-deb-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          tag_version="${GITHUB_REF_NAME#v}"

          for arch in amd64 arm64; do
            for extension in deb changes buildinfo; do
              asset="release-assets/cyberos_${tag_version}_${arch}.${extension}"
              if [[ ! -f "$asset" ]]; then
                echo "Missing release asset $asset" >&2
                find release-assets -maxdepth 1 -type f -print >&2
                exit 1
              fi
            done
          done

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.deb *.changes *.buildinfo > SHA256SUMS
          cat SHA256SUMS

          arm64_asset="cyberos_${GITHUB_REF_NAME#v}_arm64.deb"
          arm64_sha256="$(awk -v asset="$arm64_asset" '$2 == asset { print $1; exit }' SHA256SUMS)"
          if [[ ! "$arm64_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not find a SHA256 checksum for $arm64_asset" >&2
            exit 1
          fi
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg commitSha "$GITHUB_SHA" \
            --arg architecture "arm64" \
            --arg asset "$arm64_asset" \
            --arg sha256 "$arm64_sha256" \
            '{
              repository: $repository,
              tag: $tag,
              version: $version,
              commitSha: $commitSha,
              architecture: $architecture,
              asset: $asset,
              sha256: $sha256
            }' \
            > release-manifest.json

          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg commitSha "$GITHUB_SHA" \
            --arg asset "$arm64_asset" \
            --arg sha256 "$arm64_sha256" \
            '.repository == $repository and
             .tag == $tag and
             .version == $version and
             .commitSha == $commitSha and
             .architecture == "arm64" and
             .asset == $asset and
             .sha256 == $sha256' \
            release-manifest.json >/dev/null
          cat release-manifest.json

      - name: Upload CM5 release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cm5-release-manifest
          path: release-assets/release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
