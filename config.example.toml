root_dir = ".zos/dev-root"
environment = "development"

[api]
host = "127.0.0.1"
port = 3010
allowed_origins = []

[mcp]
enabled = true
pi_enabled = false
pi_token_file = "mcp/pi.token"
legacy_pi_tools_enabled = false
external_enabled = false
shell_enabled = false
allowed_hosts = ["localhost", "127.0.0.1", "[::1]"]
allowed_origins = ["localhost", "127.0.0.1", "[::1]"]
max_concurrent_per_client = 4

[worker]
poll_ms = 750

[monitoring]
enabled = true
fast_sample_interval_ms = 10000
standard_sample_interval_ms = 30000
temperature_sample_interval_ms = 300000
raw_retention_ms = 172800000
minute_retention_ms = 2592000000
hour_retention_ms = 31536000000
max_database_bytes = 536870912

# Optional byte-identical HTTPS mirror for the managed offline map.
# [photostaff]
# basemap_url = "https://mirror.example.com/zos/natural-earth-ii-3.2.0-raster.pmtiles"

[admin]
display_name = "ZOS Admin"
auth_mode = "local-only"

[model]
provider = "pi"
pi_command = "pi"
local_endpoint = ""

[docker]
enabled = false
socket_path = "/var/run/docker.sock"
compose_command = "docker"
operation_timeout_ms = 120000
console_shells = ["/bin/sh", "/bin/bash"]

# Docker socket access is root-equivalent. Only enable this on a trusted
# single-user appliance, and grant the zos service access deliberately.
# Managed Compose Apps always use /zos/apps; this path is not configurable.

[vm]
enabled = true
libvirt_uri = "qemu:///system"
storage_path = ".zos/dev-root/vm"
network_name = "default"
iso_roots = [".zos/dev-root/iso"]
operation_timeout_ms = 120000
console_mode = "serial"

[[nas_roots]]
id = "primary"
name = "Primary NAS"
path = ".zos/dev-root/data/primary"

[backup]
enabled = false
repository_path = ".zos/dev-root/data/backup/restic"
password_file = ".zos/dev-root/config/restic-password"
staging_path = ".zos/dev-root/state/backup-staging"
require_mount = false
retry_count = 2
timeout_ms = 300000
keep_daily = 7
keep_weekly = 4

[health]
stale_index_warning_ms = 7200000
stale_index_critical_ms = 21600000
stalled_run_ms = 900000
consecutive_failure_threshold = 2
backup_stale_ms = 93600000
