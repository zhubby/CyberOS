data_dir = "/var/lib/sigmaos"
environment = "development"

[api]
host = "127.0.0.1"
port = 3010
allowed_origins = []

[worker]
poll_ms = 750

# Optional byte-identical HTTPS mirror for the managed offline map.
# [photostaff]
# basemap_url = "https://mirror.example.com/sigmaos/natural-earth-ii-3.2.0-raster.pmtiles"

[admin]
display_name = "SigmaOS Admin"
auth_mode = "local-only"

[model]
provider = "pi"
pi_command = "pi"
local_endpoint = ""

[docker]
enabled = false
socket_path = "/var/run/docker.sock"
compose_command = "docker"
operation_timeout_ms = 120000
console_shells = ["/bin/sh", "/bin/bash"]

# Docker socket access is root-equivalent. Only enable this on a trusted
# single-user appliance, and grant the sigmaos service access deliberately.
# Managed Compose Apps always use /srv/apps; this path is not configurable.

[vm]
enabled = true
libvirt_uri = "qemu:///system"
storage_path = "/var/lib/sigmaos/vmstore"
network_name = "default"
iso_roots = ["/srv/iso"]
operation_timeout_ms = 120000
console_mode = "serial"

[[nas_roots]]
id = "primary"
name = "Primary NAS"
path = "/srv/nas"

[backup]
enabled = false
repository_path = "/srv/backup/restic"
password_file = "/etc/sigmaos/restic-password"
staging_path = "/var/lib/sigmaos/backup-staging"
require_mount = false
retry_count = 2
timeout_ms = 300000
keep_daily = 7
keep_weekly = 4

[health]
stale_index_warning_ms = 7200000
stale_index_critical_ms = 21600000
stalled_run_ms = 900000
consecutive_failure_threshold = 2
backup_stale_ms = 93600000
