<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/zos-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZOS</title>
    <script>
      (() => {
        const root = document.documentElement;
        let theme = "light";
        let themePreference = "light";
        let language = navigator.language?.toLowerCase().startsWith("zh") ? "zh-CN" : "en";
        try {
          const storedTheme = localStorage.getItem("zos:theme");
          const storedLanguage = localStorage.getItem("zos:language");
          themePreference = storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
            ? storedTheme
            : "light";
          theme = themePreference === "system"
            ? window.matchMedia?.("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : themePreference;
          language = storedLanguage === "zh-CN"
            ? "zh-CN"
            : storedLanguage === "en"
              ? "en"
              : language;
        } catch {
          theme = "light";
          themePreference = "light";
        }
        root.dataset.theme = theme;
        root.dataset.themePreference = themePreference;
        root.lang = language;
      })();
    </script>
    <style>
      :root,
      :root[data-theme="light"] {
        --boot-bg: #faf9f5;
        --boot-panel: #fffdfa;
        --boot-line: #d1cfc5;
        --boot-text: #141413;
        --boot-muted: #5e5d59;
        --boot-muted-2: #6b6964;
        --boot-accent: #d97757;
        --boot-danger: #953f3f;
      }

      :root[data-theme="dark"] {
        --boot-bg: #1c1b19;
        --boot-panel: #292723;
        --boot-line: #4a463f;
        --boot-text: #f4f1e8;
        --boot-muted: #c2bcb1;
        --boot-muted-2: #aaa49a;
        --boot-accent: #e58a6c;
        --boot-danger: #eca0a0;
      }

      html,
      body {
        min-width: 320px;
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: var(--boot-bg);
      }

      #zos-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: var(--boot-text);
        background: var(--boot-bg);
        opacity: 1;
        transition: opacity 260ms cubic-bezier(.2, .72, .2, 1), visibility 260ms linear;
      }

      #zos-boot.is-exiting {
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
      }

      .zos-boot-shell {
        display: grid;
        justify-items: center;
        width: min(340px, calc(100vw - 40px));
        box-sizing: border-box;
        padding: 28px;
        text-align: center;
        animation: zos-boot-arrive 320ms cubic-bezier(.2, .72, .2, 1) both;
      }

      .zos-boot-brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        color: var(--boot-text);
        font: 600 24px/1 Newsreader, Georgia, serif;
        letter-spacing: 0;
      }

      .zos-boot-brand img {
        width: 38px;
        height: 38px;
      }

      .zos-boot-copy {
        display: grid;
        gap: 6px;
        margin-top: 30px;
      }

      .zos-boot-copy strong {
        color: var(--boot-text);
        font: 500 22px/1.2 Newsreader, Georgia, serif;
        letter-spacing: 0;
      }

      .zos-boot-copy span {
        color: var(--boot-muted);
        font: 400 12px/1.5 Inter, system-ui, sans-serif;
      }

      .zos-boot-progress {
        width: 96px;
        height: 2px;
        margin-top: 24px;
        overflow: hidden;
        background: color-mix(in srgb, var(--boot-line) 70%, transparent);
      }

      .zos-boot-progress span {
        display: block;
        width: 42%;
        height: 100%;
        background: var(--boot-accent);
        animation: zos-boot-progress 1.35s ease-in-out infinite;
      }

      .zos-boot-footer {
        margin-top: 16px;
        color: var(--boot-muted-2);
        font: 500 10px/1.4 Inter, system-ui, sans-serif;
      }

      #zos-boot[data-state="error"] .zos-boot-brand {
        color: var(--boot-danger);
      }

      #zos-boot[data-state="error"] .zos-boot-progress {
        display: none;
      }

      .zos-boot-retry {
        display: none;
        min-height: 38px;
        margin-top: 22px;
        padding: 0 16px;
        border: 1px solid var(--boot-text);
        border-radius: 7px;
        color: var(--boot-bg);
        background: var(--boot-text);
        cursor: pointer;
        font: 600 12px/1 Inter, system-ui, sans-serif;
      }

      .zos-boot-retry:hover {
        border-color: var(--boot-accent);
        background: var(--boot-accent);
      }

      #zos-boot[data-state="error"] .zos-boot-retry {
        display: inline-flex;
        align-items: center;
      }

      @keyframes zos-boot-arrive {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes zos-boot-progress {
        0% { transform: translateX(-120%); }
        60%, 100% { transform: translateX(245%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #zos-boot,
        .zos-boot-shell,
        .zos-boot-progress span {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="zos-boot" role="status" aria-live="polite" aria-busy="true">
      <div class="zos-boot-shell">
        <div class="zos-boot-brand">
          <img src="/zos-icon.svg" alt="" width="38" height="38" />
          <span>ZOS</span>
        </div>
        <div class="zos-boot-copy">
          <strong data-boot-title>Preparing workspace</strong>
          <span data-boot-detail>Connecting to local services</span>
        </div>
        <div class="zos-boot-progress" aria-hidden="true"><span></span></div>
        <div class="zos-boot-footer">
          <span data-boot-system>Local system</span>
        </div>
        <button class="zos-boot-retry" type="button" data-boot-retry>Reload</button>
      </div>
    </div>
    <script>
      (() => {
        const bootScreen = document.getElementById("zos-boot");
        if (!bootScreen) return;

        const bootTitle = bootScreen.querySelector("[data-boot-title]");
        const bootDetail = bootScreen.querySelector("[data-boot-detail]");
        const bootRetry = bootScreen.querySelector("[data-boot-retry]");
        const isChinese = document.documentElement.lang.toLowerCase().startsWith("zh");
        let ready = false;

        const showError = () => {
          if (ready) return;
          bootScreen.dataset.state = "error";
          bootScreen.setAttribute("aria-busy", "false");
          if (bootTitle) bootTitle.textContent = isChinese ? "ZOS 启动失败" : "ZOS could not start";
          if (bootDetail) bootDetail.textContent = isChinese ? "请重新加载页面后再试" : "Reload the page to try again";
        };

        const timeout = window.setTimeout(showError, 15000);
        const handleError = () => showError();
        const handleReady = () => {
          ready = true;
          window.clearTimeout(timeout);
          window.removeEventListener("error", handleError, true);
          window.removeEventListener("unhandledrejection", handleError);
        };

        window.addEventListener("error", handleError, true);
        window.addEventListener("unhandledrejection", handleError);
        window.addEventListener("zos:ready", handleReady, { once: true });
        bootRetry?.addEventListener("click", () => {
          const url = new URL(window.location.href);
          url.searchParams.set("_zos_reload", Date.now().toString());
          window.location.replace(url.toString());
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
